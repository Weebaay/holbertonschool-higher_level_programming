<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
			<img src="../images/logo.png" alt="Application Logo" class="logo">
            <a href="login.html" id="login-link" style="display: none;">Login</a>
        </nav>
    </header>
    <main>
        <section id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="50">50 USD</option>
                <option value="100">100 USD</option>
                <option value="200">200 USD</option>
            </select>
        </section>
        <section id="places-list">
			<!-- Example static card for a place -->
			<div class="place-card">
				<img src="../images/image_place1.png" alt="Beachfront Villa">
				<h3>Beachfront Villa</h3>
				<p>Price: $120 per night</p>
				<a href="place.html" class="details-button">View Details</a>
			</div>
			<div class="place-card">
				<img src="../images/images_place2.png" alt="Mountain Retreat">
				<h3>Mountain Retreat</h3>
				<p>Price: $85 per night</p>
				<a href="place.html" class="details-button">View Details</a>
			</div>
        </section>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
